<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel ondulado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Just+Me+Again+Down+Here&amp;family=Libre+Franklin:wght@700;800;900&amp;family=Newsreader:ital,opsz,wght@1,6..72,600;1,6..72,700;1,6..72,800&amp;display=swap">
<style>
body { margin: 0; }
.palco { display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px; padding: 40px; height: 640px; box-sizing: border-box; }
.painel { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
.foto { position: relative; border-radius: 0; overflow: hidden; }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<div class="palco al-listras al-listras--vivo">
  <div class="al-painel-ondulado painel" data-theme="calmaria">
    <span class="al-anotacao manuscrita-md" style="position:static; --giro:0deg">auto cuidado</span>
    <h2 class="impacto-lg" style="color:var(--tinta); font-size:78px">Como funciona o beauty house?</h2>
    <span class="manuscrita-md al-cor-acento">arraste e veja</span>
  </div>
  <div class="foto al-recorte-ondulado"><img class="" src="/_blob/e6a93fd99c66086f6e83e70fb93b1a00" alt="Mala de atendimento da Ana Lívia"></div>
</div>
</body>
</html>
