<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Listras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Just+Me+Again+Down+Here&amp;family=Libre+Franklin:wght@700;800;900&amp;family=Newsreader:ital,opsz,wght@1,6..72,600;1,6..72,700;1,6..72,800&amp;display=swap">
<style>
body { margin: 0; }
.grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; padding: 32px; }
.grade div { height: 240px; border-radius: var(--raio-cartao); }
.grade p { margin: 10px 0 0; font: 500 20px/1.2 var(--font-texto); color: var(--calmaria); text-align: center; }
</style>
</head>
<body>
<div class="grade" style="background:var(--auto-cuidado)">
  <figure style="margin:0"><div class="al-listras"></div><p>al-listras</p></figure>
  <figure style="margin:0"><div class="al-listras al-listras--vivo"></div><p>al-listras--vivo</p></figure>
  <figure style="margin:0"><div class="al-listras al-listras--raizes"></div><p>al-listras--raizes</p></figure>
  <figure style="margin:0"><div class="al-listras al-listras--creme"></div><p>al-listras--creme</p></figure>
</div>
</body>
</html>
