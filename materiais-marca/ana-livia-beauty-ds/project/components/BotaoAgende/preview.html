<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Agende seu horário</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Just+Me+Again+Down+Here&amp;family=Libre+Franklin:wght@700;800;900&amp;family=Newsreader:ital,opsz,wght@1,6..72,600;1,6..72,700;1,6..72,800&amp;display=swap">
<style>
body { margin: 0; }
.grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; padding: 32px; }
.grade .al-amostra { height: 170px; }
</style>
</head>
<body>
<div class="grade">
  <div class="al-amostra" data-theme="creme"><div class="al-agende"><span class="al-agende__rotulo texto-md">Agende seu horário</span><span class="al-agende__pill cta-numero"><span class="al-agende__ddd">(00)</span>00000-0000</span></div></div>
  <div class="al-amostra" data-theme="calmaria"><div class="al-agende"><span class="al-agende__rotulo texto-md">Agende seu horário</span><span class="al-agende__pill cta-numero"><span class="al-agende__ddd">(00)</span>00000-0000</span></div></div>
  <div class="al-amostra" data-theme="magenta"><div class="al-agende"><span class="al-agende__rotulo texto-md">Agende agora e garanta seu atendimento</span><span class="al-agende__pill cta-numero"><span class="al-agende__ddd">(00)</span>00000-0000</span></div></div>
  <div class="al-amostra" data-theme="raizes"><div class="al-agende al-agende--contorno"><span class="al-agende__rotulo texto-md">Agende seu horário e viva a transformação:</span><span class="al-agende__pill cta-numero"><span class="al-agende__ddd">(00)</span>00000-0000</span></div></div>
</div>
</body>
</html>
